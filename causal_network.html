.ed line,.ed path{transition:opacity .2s;pointer-events:none}

<g class="ed" data-from="guogong" data-to="civil"><path d="M220,780 Q440,810 660,780" fill="none" stroke="rgba(var(--axr),.35)" stroke-width="2" marker-end="url(#ah_ch)"/><text x="440" y="810" fill="rgba(var(--axr),.6)" font-size="7" font-family="Noto Sans JP">上海クーデタ→国共分裂→内戦</text></g>

<g class="nd" data-id="opium" data-desc="<strong>アヘン戦争(1840-42)</strong><br>イギリスが清に開国を強制。★南京条約(1842)＝★<b>不平等条約体制の始まり</b>→香港割譲・5港開港・公行制度の廃止。アロー戦争(1856-60)→北京条約→天津条約。<br>★「西洋の衝撃」→中華世界秩序(朝貢体制)の崩壊が始まる。"><rect x="110" y="20" width="210" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="215" y="42" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">アヘン戦争(1840-42)</text></g>

<g class="nd" data-id="taiping" data-desc="<strong>太平天国(1851-64)</strong><br>洪秀全がキリスト教的な「拝上帝会」を組織→南京を占領(「天京」)→★<b>清朝史上最大の内乱</b>→人口約2000万人が犠牲。<br>天朝田畝制度(土地均分)・纏足禁止(女性解放)。<br>★曾国藩の湘軍・李鴻章の淮軍(漢人の地方軍)が鎮圧→★<b>漢人官僚の台頭</b>→洋務運動へ。"><rect x="110" y="140" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="215" y="162" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">太平天国(1851-64)</text></g>

<g class="nd" data-id="yangwu" data-desc="<strong>洋務運動(1861-95)</strong><br>★<b>「中体西用」</b>＝中国の体制(体)は維持し西洋の技術(用)だけを導入。曾国藩・李鴻章・左宗棠・張之洞。<br>軍事工場(江南製造総局)・海軍(北洋艦隊)・通信・鉄道。<br>★<b>制度改革を伴わない技術導入の限界</b>＝日清戦争の敗北で証明される。"><rect x="490" y="140" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="595" y="162" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">洋務運動(1861-95)</text></g>

<g class="nd" data-id="sino_jp" data-desc="<strong>日清戦争(1894-95)</strong><br>朝鮮の甲午農民戦争(東学党の乱)→日清両国が出兵→★<b>下関条約</b>(1895)＝遼東半島・台湾割譲・賠償金2億両・朝鮮の独立承認。★三国干渉→遼東半島返還。<br>★<b>「中体西用」の失敗を証明</b>→制度改革(変法)の議論が活発化。<br>★列強の中国分割(租借地・勢力範囲)の契機。"><rect x="340" y="260" width="210" height="40" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="445" y="284" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">日清戦争(1894-95)</text></g>

<g class="nd" data-id="wuxu" data-desc="<strong>戊戌変法(1898)</strong><br>★康有為・梁啓超が光緒帝に改革を建議→★<b>百日維新(103日間)</b>→科挙の改革・近代的学校設立・軍制改革等を急進的に実施。<br>★<b>西太后のクーデタ(戊戌政変)</b>で挫折→譚嗣同ら6人処刑(戊戌六君子)→光緒帝は幽閉。<br>★改革派の挫折→革命派(孫文)が台頭する契機。"><rect x="110" y="380" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="215" y="402" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">戊戌変法(1898)</text></g>

<g class="nd" data-id="boxer" data-desc="<strong>義和団事件(1900)</strong><br>「扶清滅洋」を掲げる義和団(民衆の排外運動)→北京の列国公使館を包囲→★<b>8カ国連合軍</b>(英米仏独露日伊墺)が北京を占領。<br>★<b>北京議定書</b>(1901)＝巨額の賠償金＋列国の北京駐兵権→清の半植民地化が決定的に。<br>→清末新政(科挙廃止1905等)→ただし「too late」。"><rect x="560" y="380" width="210" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="665" y="402" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">義和団事件(1900)</text></g>

<g class="nd" data-id="xinhai" data-desc="<strong>辛亥革命(1911)</strong><br>四川暴動(鉄道国有化反対)→武昌蜂起(1911.10.10)→各省が独立宣言→★<b>中華民国</b>成立(1912.1.1)→孫文が臨時大総統→★<b>宣統帝(溥儀)退位</b>(1912.2)。<br>★<b>アジア最初の共和国</b>。三民主義(民族・民権・民生)。<br>ただし袁世凱に大総統の座を譲渡→袁世凱の独裁→帝政運動→死(1916)→軍閥割拠。"><rect x="110" y="500" width="210" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/><text x="215" y="522" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">辛亥革命(1911)</text></g>

<g class="nd" data-id="warlord" data-desc="<strong>軍閥割拠(1916-28)</strong><br>袁世凱死後に中央政府の権威が崩壊→各地の軍閥(直隷派・安徽派・奉天派)が割拠→統一国家が機能しない時代。<br>★<b>日本の対華21カ条要求</b>(1915)→中国のナショナリズムを刺激。"><rect x="110" y="620" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="215" y="642" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">軍閥割拠(1916-28)</text></g>

<g class="nd" data-id="may4" data-desc="<strong>五四運動(1919)</strong><br>パリ講和会議でドイツが持っていた山東省の権益が日本に移譲→★<b>北京の学生が抗議デモ(1919.5.4)</b>→全国的な反日・反帝国主義運動に拡大。<br>★<b>新文化運動</b>(白話文学＝魯迅「狂人日記」・陳独秀「新青年」)の延長。<br>★<b>マルクス主義の受容</b>→李大釗・陳独秀→★<b>中国共産党結成(1921)</b>。"><rect x="390" y="620" width="210" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/><text x="495" y="642" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">五四運動(1919)</text></g>

<g class="nd" data-id="guogong" data-desc="<strong>第一次国共合作(1924-27)</strong><br>孫文が「連ソ・容共・扶助工農」を採択→国民党と共産党が協力→★<b>北伐</b>(1926蒋介石)→軍閥打倒。<br>★<b>上海クーデタ(1927.4.12)</b>＝蒋介石が共産党を弾圧→国共分裂→★<b>南京国民政府</b>樹立。<br>共産党→農村に拠点→江西ソヴィエト→★<b>長征(1934-36)</b>→毛沢東が指導権確立。"><rect x="110" y="740" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="215" y="762" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">国共合作と分裂(1924-27)</text></g>

<g class="nd" data-id="civil" data-desc="<strong>日中戦争→国共内戦(1937-49)</strong><br>★<b>西安事件</b>(1936)→第二次国共合作→★<b>日中戦争</b>(1937盧溝橋事件→南京事件→重慶遷都)。<br>戦後→国共内戦再開→★<b>共産党の勝利</b>(農民の支持＋土地改革＋ゲリラ戦術)。<br>国民党は台湾に撤退(1949)。"><rect x="560" y="740" width="210" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="665" y="762" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">日中戦争→国共内戦</text></g>

<g class="nd" data-id="prc" data-desc="<strong>中華人民共和国(1949-)</strong><br>★毛沢東が天安門で建国宣言(1949.10.1)。朝鮮戦争参戦→大躍進政策(1958失敗)→★<b>文化大革命</b>(1966-76)→毛沢東死去→★<b>改革開放</b>(1978鄧小平)→★<b>天安門事件</b>(1989)→市場経済化→世界第2位の経済大国。"><rect x="560" y="850" width="210" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/><text x="665" y="872" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">中華人民共和国(1949-)</text></g>

</svg></div>

<g class="ed" data-from="imperialism" data-to="ww2ea"><line x1="400" y1="566" x2="400" y2="650" stroke="rgba(var(--axr),.35)" stroke-width="2" marker-end="url(#ah_ea)"/><text x="410" y="610" fill="rgba(var(--axr),.6)" font-size="7" font-family="Noto Sans JP">大東亜共栄圏→太平洋戦争</text></g>
<g class="ed" data-from="ww2ea" data-to="coldwar_ea"><line x1="400" y1="700" x2="400" y2="775" stroke="rgba(var(--axr),.35)" stroke-width="2" marker-end="url(#ah_ea)"/><text x="410" y="740" fill="rgba(var(--axr),.6)" font-size="7" font-family="Noto Sans JP">日本敗戦→米ソによる分断</text></g>

<g class="nd" data-id="sakuho" data-desc="<strong>冊封体制(前漢〜19C)</strong><br>★<b>中国皇帝が周辺国の王を「冊封」</b>＝称号と印璽を授けて君臣関係を結ぶ→東アジアの国際秩序の基本原理。<br>朝鮮・ベトナム・琉球が典型的な冊封国。日本は★<b>足利義満以降は冊封から離脱</b>→独自の立場。<br>★<b>華夷秩序</b>＝中華(文明)を中心に同心円状に「夷狄」が広がるという世界観。"><rect x="80" y="20" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="185" y="42" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">冊封体制(前漢〜19C)</text></g>

<g class="nd" data-id="chokou" data-desc="<strong>朝貢貿易</strong><br>冊封国が中国に使節を送り貢物を献上→★<b>中国皇帝が「回賜」として数倍の品を与える</b>→実質的には中国が損をする→ただし「中華の威信」の表現。<br>明の★<b>海禁政策</b>→朝貢貿易が唯一の合法的貿易→密貿易(倭寇)の原因に。<br>★<b>清代</b>＝広州一港貿易(公行制度)→イギリスとの摩擦→アヘン戦争の遠因。"><rect x="580" y="20" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="685" y="42" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">朝貢貿易</text></g>

<g class="nd" data-id="western" data-desc="<strong>西洋の衝撃(18C末〜19C)</strong><br>★アヘン戦争(1840-42)→南京条約→★<b>不平等条約体制の始まり</b>。ペリー来航(1853)→日本の開国。<br>★<b>冊封体制(華夷秩序)とウェストファリア体制(主権国家体系)の衝突</b>→前者が後者に敗北。<br>各国の対応：日本(明治維新)＝成功、清(洋務運動)＝失敗、朝鮮(鎖国→開国)＝遅れ。"><rect x="80" y="150" width="210" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="185" y="172" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">西洋の衝撃(18C末〜19C)</text></g>

<g class="nd" data-id="treaty" data-desc="<strong>条約体制への移行(19C半ば)</strong><br>★<b>不平等条約の網</b>＝領事裁判権・協定関税・最恵国待遇→東アジア各国を「条約体制」に組み込む。<br>★<b>万国公法(国際法)の受容</b>→日本が最も積極的(条約改正を目標に近代化)。<br>★<b>冊封体制と条約体制の並存期</b>＝清は朝鮮・ベトナムとの宗属関係を主張し続ける→日清・仏清戦争の一因。"><rect x="80" y="275" width="210" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/><text x="185" y="297" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">条約体制への移行(19C半ば)</text></g>

<g class="nd" data-id="sino_jp2" data-desc="<strong>日清戦争(1894-95)</strong><br>★<b>東アジア国際秩序の転換点</b>。日本が清(冊封体制の中心)に勝利→★<b>冊封体制の最終的な崩壊</b>→朝鮮の独立(＝清との宗属関係の消滅)。<br>★<b>下関条約</b>→台湾割譲・遼東半島(→三国干渉で返還)・賠償金。<br>★列強の中国分割が本格化→租借地(独＝膠州湾・露＝旅順大連・英＝威海衛・仏＝広州湾)。"><rect x="240" y="388" width="210" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="345" y="410" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">日清戦争(1894-95)</text></g>

<g class="nd" data-id="russo_jp" data-desc="<strong>日露戦争(1904-05)</strong><br>満州・朝鮮をめぐる日露対立→★<b>ポーツマス条約</b>＝南樺太・南満州鉄道・韓国の優越権。<br>★<b>非白人国家が白人大国に勝利</b>→アジアの民族運動に衝撃(イラン立憲革命・青年トルコ革命・インドの国民会議派)。<br>★日本の韓国併合(1910)→東アジアにおける日本の帝国主義が確立。"><rect x="560" y="488" width="210" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="665" y="510" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">日露戦争(1904-05)</text></g>

<g class="nd" data-id="imperialism" data-desc="<strong>日本の帝国主義(1910-45)</strong><br>★韓国併合(1910)→★<b>21カ条要求</b>(1915)→山東問題→満州事変(1931)→★<b>満州国</b>(1932傀儡国家)→日中戦争(1937)→<b>大東亜共栄圏</b>。<br>★<b>東アジアにおける「新秩序」の試み</b>＝欧米帝国主義に代わる日本中心の秩序→ただし実態は日本の支配と搾取。"><rect x="295" y="530" width="210" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/><text x="400" y="552" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">日本の帝国主義(1910-45)</text></g>

<g class="nd" data-id="ww2ea" data-desc="<strong>WW2と東アジア(1941-45)</strong><br>★<b>太平洋戦争</b>(1941.12真珠湾)→日本の敗戦(1945.8)→★<b>帝国主義的秩序の完全な崩壊</b>。<br>★<b>カイロ宣言</b>(1943)→ヤルタ会談→ポツダム宣言→日本の無条件降伏。<br>★<b>東アジアの再編</b>＝中華民国が常任理事国に(→中華人民共和国に交替1971)。朝鮮の南北分断(38度線)。日本の占領(GHQ)。"><rect x="295" y="655" width="210" height="40" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/><text x="400" y="679" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">WW2と東アジア(1941-45)</text></g>

<g class="nd" data-id="coldwar_ea" data-desc="<strong>冷戦と東アジア(1945-)</strong><br>★<b>米ソ冷戦</b>→東アジアの分断＝★<b>朝鮮半島の南北分断</b>(1948)→朝鮮戦争(1950-53)→★<b>中国大陸と台湾の分断</b>。<br>日米安保体制(1951)＋日韓基本条約(1965)＋日中国交正常化(1972)。<br>★<b>冷戦の終結(1989)</b>→ただし東アジアでは★<b>冷戦構造が残存</b>(北朝鮮・台湾問題・米中対立)→★<b>21世紀の「新冷戦」</b>へ？<br>★冊封体制→条約体制→帝国主義→冷戦→米中二極という<b>東アジア国際秩序の重層的変容</b>。"><rect x="295" y="780" width="210" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/><text x="400" y="802" text-anchor="middle" fill="#d4c088" font-size="8" font-family="Noto Serif JP" font-weight="700">冷戦と東アジア(1945-)</text></g>

</svg></div>

<g class="nd" data-id="bagh" data-desc="<strong>バグダードの繁栄</strong><br>第2代カリフのマンスールが建設。ハールーン＝アッラシードの時代に全盛。タラス河畔の戦い(751)を機に製紙法が伝わる。<br>★<b>「知恵の館」</b>でギリシア語文献をアラビア語に翻訳→のちラテン語に重訳され西欧の12世紀ルネサンスへ。">

</g>
<g class="nd" data-id="mamluk" data-desc="<strong>マムルークの台頭(9C-)</strong><br>カリフが騎馬戦士として優秀な<b>トルコ人の奴隷を親衛隊に採用</b>。<br>★やがて軍人がカリフの廃立を左右するようになり、カリフの実権が失われていく。">

</g>
<g class="nd" data-id="buya" data-desc="<strong>ブワイフ朝(932-1062)</strong><br>イラン系のシーア派軍事政権。946年バグダードに入城し、カリフから<b>大アミール</b>に任じられて実権を掌握。<br>★軍人に俸給の代わりに徴税権を与える<b>イクター制</b>を開始→セルジューク朝以降に継承。">

<rect x="551" y="740" width="178" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>

<g class="nd" data-id="end" data-desc="<strong>アッバース朝の滅亡(1258)</strong><br>カリフは名目的な存在のまま存続したが、モンゴルの<b>フラグ</b>がバグダードを攻略して滅ぼした。<br>★以後、イスラーム世界の中心はマムルーク朝のカイロへ。">

<g class="nd" data-id="juntian" data-desc="<strong>律令体制の動揺(8C)</strong><br>人口増加と土地不足、貴族・寺院の荘園拡大で<b>均田制</b>が行き詰まり、重い負担を嫌った農民が逃亡。<br>★農民から徴兵する<b>府兵制</b>が維持できなくなり、傭兵を用いる<b>募兵制</b>へ。">

<text x="160.0" y="42.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">均田制・租調庸制・府兵制の動揺</text>
</g>
<g class="nd" data-id="jiedu" data-desc="<strong>節度使</strong><br>募兵を率いて辺境を守る軍団の司令官。玄宗の時代に10の節度使が置かれた。<br>★軍事だけでなく、任地の<b>民政・財政まで握る</b>ようになり、半独立の勢力に成長。">
<rect x="400" y="20" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="470.0" y="42.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">節度使の設置(辺境防衛)</text>
</g>
<g class="nd" data-id="xuan" data-desc="<strong>玄宗の治世後半</strong><br>前半は「開元の治」と称えられたが、晩年は楊貴妃を寵愛し、その一族の楊国忠が実権を握る。<br>★ソグド系の節度使<b>安禄山</b>と楊国忠の対立が深まる。">
<rect x="680" y="20" width="140" height="36" rx="6" fill="rgba(130,130,100,.15)" stroke="rgba(130,130,100,.3)" stroke-width="1.5"/>
<text x="750.0" y="42.0" text-anchor="middle" fill="#c0c0a0" font-size="9" font-family="Noto Serif JP" font-weight="700">玄宗治世後半の政治の弛緩</text>
</g>
<g class="nd" data-id="anshi" data-desc="<strong>★安史の乱(755-763)</strong><br>平盧・范陽・河東の<b>3節度使を兼ねた安禄山</b>と部下の史思明が挙兵。洛陽・長安が陥落し、玄宗は四川へ逃れた。<br>★<b>ウイグルの援軍</b>を得てようやく鎮圧。唐の支配は根本から変質する。">
<rect x="370" y="135" width="140" height="46" rx="6" fill="rgba(180,80,80,.2)" stroke="rgba(180,80,80,.4)" stroke-width="1.5"/>
<text x="440.0" y="162.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">★安史の乱(755-763)</text>
</g>
<g class="nd" data-id="fanzhen" data-desc="<strong>藩鎮の割拠</strong><br>乱の鎮圧のため内地にも節度使を配置。彼らは軍事・行政・財政を握って<b>藩鎮</b>として自立し、とくに河北では租税を中央に送らなかった。<br>★唐の財政は、大運河で結ばれた江南の税収と塩の専売に依存するようになった。">
<rect x="80" y="260" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="150.0" y="282.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">藩鎮の割拠</text>
</g>
<g class="nd" data-id="liangshui" data-desc="<strong>両税法(780)</strong><br>宰相<b>楊炎</b>の建議。租調庸に代え、現住地で<b>実際に持つ土地・資産に応じて夏・秋2回</b>課税。銭納が原則。<br>★国家が<b>土地私有(大土地所有)を公認</b>したことを意味する。あわせて塩の専売が財政の柱に。">
<rect x="370" y="260" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="440.0" y="282.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">両税法(780)・塩の専売</text>
</g>
<g class="nd" data-id="uighur" data-desc="<strong>周辺勢力の圧迫</strong><br>ウイグルは援軍の見返りに不利な<b>絹馬貿易</b>を唐に強いた。吐蕃は763年に一時長安を占領し、河西回廊を押さえる。<br>★唐は西域への影響力を失う。">
<rect x="670" y="260" width="140" height="36" rx="6" fill="rgba(100,130,180,.15)" stroke="rgba(100,130,180,.3)" stroke-width="1.5"/>
<text x="740.0" y="282.0" text-anchor="middle" fill="#88b0d4" font-size="9" font-family="Noto Serif JP" font-weight="700">ウイグル・吐蕃の圧迫</text>
</g>
<g class="nd" data-id="huang" data-desc="<strong>黄巣の乱→唐の滅亡</strong><br>塩の密売商人の<b>黄巣</b>らが蜂起し、全国を転戦して長安を占領。<br>★乱の中で台頭した節度使の<b>朱全忠</b>が907年に唐を滅ぼし、後梁を建国。">
<rect x="201" y="380" width="177" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="290.0" y="402.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">黄巣の乱(875-884)→唐の滅亡(907)</text>
</g>
<g class="nd" data-id="noble" data-desc="<strong>門閥貴族の没落</strong><br>魏晋南北朝以来、家柄を誇り高級官職を占めてきた貴族が、戦乱の中で荘園を失い、多くが殺害された。<br>★家柄にもとづく支配層が消滅。">
<rect x="570" y="380" width="140" height="36" rx="6" fill="rgba(130,130,100,.15)" stroke="rgba(130,130,100,.3)" stroke-width="1.5"/>
<text x="640.0" y="402.0" text-anchor="middle" fill="#c0c0a0" font-size="9" font-family="Noto Serif JP" font-weight="700">門閥貴族の没落</text>
</g>
<g class="nd" data-id="wudai" data-desc="<strong>五代十国(907-979)</strong><br>華北に後梁・後唐・後晋・後漢・後周の5王朝、各地に10余りの国。いずれも節度使出身の武人が建てた。<br>★後晋が建国の援助の代償に<b>燕雲十六州を契丹(遼)に割譲</b>(936)。">
<rect x="214" y="500" width="152" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="290.0" y="522.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">五代十国(907-979)＝武断政治</text>
</g>
<g class="nd" data-id="land" data-desc="<strong>新興地主層の台頭</strong><br>貴族に代わり、土地を買い集めた新興の地主＝<b>形勢戸</b>が成長。小作人の<b>佃戸</b>に耕作させて収穫の半分ほどを小作料として取る。<br>★家柄ではなく経済力にもとづく新しい支配層。">
<rect x="570" y="500" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="640.0" y="522.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">新興地主(形勢戸)と佃戸制</text>
</g>
<g class="nd" data-id="song" data-desc="<strong>★宋(北宋 960-1127)の文治主義</strong><br><b>趙匡胤(太祖)</b>が節度使の権限を奪い、精鋭を皇帝直属の<b>禁軍</b>に集中。軍事・行政・財政の全権を皇帝に集めた。<br>★科挙の最終試験として皇帝自らが行う<b>殿試</b>を創設。">
<rect x="208" y="615" width="164" height="46" rx="6" fill="rgba(180,140,60,.2)" stroke="rgba(180,140,60,.4)" stroke-width="1.5"/>
<text x="290.0" y="642.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">★宋の文治主義・君主独裁(960-)</text>
</g>
<g class="nd" data-id="shi" data-desc="<strong>士大夫の成立</strong><br>科挙に合格して官僚となった、儒学の教養を備えた知識人層。多くは形勢戸の出身で、官僚を出した家は<b>官戸</b>として特権を得た。<br>★貴族に代わる新しい支配層。ただし地位は世襲できず、代々科挙に合格する必要があった。">
<rect x="580" y="620" width="140" height="36" rx="6" fill="rgba(130,100,160,.15)" stroke="rgba(130,100,160,.3)" stroke-width="1.5"/>
<text x="650.0" y="642.0" text-anchor="middle" fill="#c0a0d4" font-size="9" font-family="Noto Serif JP" font-weight="700">科挙官僚＝士大夫の成立</text>
</g>
<g class="nd" data-id="mili" data-desc="<strong>対外的な劣勢</strong><br>文官優位で軍の指揮系統が弱体化。遼と<b>澶淵の盟(1004)</b>、西夏と<b>慶暦の和約(1044)</b>を結び、毎年銀や絹を贈って平和を買った。<br>★1127年には金に華北を奪われる(靖康の変)。">
<rect x="65" y="740" width="170" height="36" rx="6" fill="rgba(100,130,180,.15)" stroke="rgba(100,130,180,.3)" stroke-width="1.5"/>
<text x="150.0" y="762.0" text-anchor="middle" fill="#88b0d4" font-size="9" font-family="Noto Serif JP" font-weight="700">軍事力の弱体化→遼・西夏への歳幣</text>
</g>
<g class="nd" data-id="comm" data-desc="<strong>経済の飛躍的発展</strong><br>占城稲の導入と囲田の造成→<b>「蘇湖(江浙)熟すれば天下足る」</b>。都市では夜間や場所の営業規制がなくなり、城外に<b>草市・鎮</b>が成立。行(商人)・作(手工業者)。<br>★銅銭の大量鋳造に加え、世界最初の紙幣<b>交子</b>。">
<rect x="390" y="740" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="460.0" y="762.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">江南開発と商業の発展</text>
</g>

<g class="nd" data-id="steppe" data-desc="<strong>草原世界の分裂(9C半ば-12C)</strong><br>840年にウイグルがキルギスに滅ぼされて以後、モンゴル高原には統一勢力がなく、諸部族が抗争。<br>★華北の金は、諸部族を互いに争わせて統制していた。">

</g>
<g class="nd" data-id="army" data-desc="<strong>軍事・社会組織</strong><br>遊牧民の騎馬戦術と高い機動力。チンギス＝ハンは部族制を解体し、遊牧民を<b>千戸制</b>(1000戸単位の軍事・行政組織)に再編した。<br>★血縁による部族連合から、ハンに直属する軍事国家へ。">
<rect x="380" y="20" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="450.0" y="42.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">騎馬軍団の機動力と千戸制</text>
</g>
<g class="nd" data-id="merch" data-desc="<strong>商人と定住民の協力</strong><br>中央アジアのムスリム商人やウイグル人が、情報・資金・文書行政の技術を提供。<br>★モンゴルは交易路の安全を保障し、商人は帝国の財務を担う共生関係。元では<b>色目人</b>として重用された。">
<rect x="669" y="20" width="161" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="750.0" y="42.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">ムスリム商人・ウイグル人の協力</text>
</g>
<g class="nd" data-id="chin" data-desc="<strong>★チンギス＝ハン(位1206-27)</strong><br>1206年、クリルタイでハン位につき大モンゴル国を建てる。ナイマン、<b>ホラズム＝シャー朝</b>、西夏を次々に滅ぼした。<br>★東西交易路の掌握をめざす征服。">
<rect x="354" y="135" width="191" height="46" rx="6" fill="rgba(180,80,80,.2)" stroke="rgba(180,80,80,.4)" stroke-width="1.5"/>
<text x="450.0" y="162.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">★チンギス＝ハンの統一(1206)と大征服</text>
</g>
<g class="nd" data-id="west" data-desc="<strong>西方遠征</strong><br><b>バトゥ</b>がロシア・東欧へ遠征、<b>ワールシュタットの戦い(1241)</b>でドイツ・ポーランド連合軍を破る。<b>フラグ</b>は1258年にバグダードを攻略してアッバース朝を滅ぼした。<br>★キプチャク＝ハン国、イル＝ハン国の成立。">
<rect x="80" y="260" width="140" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="150.0" y="282.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">西方遠征(バトゥ・フラグ)</text>
</g>
<g class="nd" data-id="yuan" data-desc="<strong>中国の征服と元</strong><br>オゴタイが金を滅ぼす(1234)。<b>フビライ</b>が大都(現在の北京)に遷都し、1271年に国号を元とする→1276年に臨安を占領して南宋を滅ぼす。<br>★モンゴル人第一主義。色目人を財務に重用し、科挙は一時停止された。">
<rect x="380" y="260" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="450.0" y="282.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">金・南宋の征服→元(1271)</text>
</g>
<g class="nd" data-id="succ" data-desc="<strong>帝国の分立</strong><br>フビライの即位に反対して<b>ハイドゥの乱</b>(1266頃-1301)。チャガタイ＝ハン国、キプチャク＝ハン国、イル＝ハン国が事実上自立した。<br>★ただし14世紀初めに和解し、大ハン(元の皇帝)を宗主とするゆるやかな連合は保たれた。">

</g>
<g class="nd" data-id="local" data-desc="<strong>諸ハン国の土着化</strong><br>少数の支配者モンゴル人が、現地のトルコ系・イラン系住民に同化。イル＝ハン国は<b>ガザン＝ハン</b>の時(1295)にイスラーム教を国教とした。<br>★宰相ラシード＝アッディーンがペルシア語で世界史『集史』を編纂。">
<rect x="60" y="380" width="140" height="36" rx="6" fill="rgba(130,100,160,.15)" stroke="rgba(130,100,160,.3)" stroke-width="1.5"/>
<text x="130.0" y="402.0" text-anchor="middle" fill="#c0a0d4" font-size="9" font-family="Noto Serif JP" font-weight="700">西方3ハン国のイスラーム化</text>
</g>
<g class="nd" data-id="pax" data-desc="<strong>★ユーラシアの一体化(「モンゴルの平和」)</strong><br>ユーラシアの大半が一つの政治的枠組みに入り、関税の簡素化と交通路の整備で<b>ヒト・モノ・情報の移動がかつてなく活発に</b>。<br>★「草原の道」「オアシスの道」「海の道」が、大都を終点として一つに結ばれた。">
<rect x="381" y="375" width="197" height="46" rx="6" fill="rgba(80,150,120,.2)" stroke="rgba(80,150,120,.4)" stroke-width="1.5"/>
<text x="480.0" y="402.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">★ユーラシアの一体化(13C後半-14C前半)</text>
</g>
<g class="nd" data-id="succr" data-desc="<strong>後継勢力の台頭(14C後半-)</strong><br>分裂した西チャガタイ＝ハン国から<b>ティムール</b>が台頭(1370)。ロシアは約240年の「タタールのくびき」の下で<b>モスクワ大公国</b>が徴税を請け負って力をつけ、1480年にイヴァン3世が自立。<br>★モンゴルの遺産の上に次の時代の帝国が育つ。">
<rect x="45" y="500" width="170" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="130.0" y="522.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">ティムール・モスクワなど後継勢力</text>
</g>
<g class="nd" data-id="jam" data-desc="<strong>交通・交易網の整備</strong><br>オゴタイの時代に整備が始まり、帝国の拡大とともにユーラシア規模に広がった。幹線道路に沿って一定の距離ごとに駅を置き、牌符(通行証)を持つ使節や商人に馬や食料を提供する<b>駅伝制(ジャムチ)</b>。大運河を補修し、海運も発達。<br>★杭州・泉州・広州などの港市が繁栄し、ムスリム商人が活躍した。">
<rect x="273" y="500" width="153" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="350.0" y="522.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">駅伝制(ジャムチ)と陸海交易網</text>
</g>
<g class="nd" data-id="cult" data-desc="<strong>東西の人と文化の往来</strong><br>プラノ＝カルピニ、ルブルック、<b>マルコ＝ポーロ</b>(『世界の記述』)、大都の大司教<b>モンテ＝コルヴィノ</b>、<b>イブン＝バットゥータ</b>(『大旅行記』)。<br>★イスラーム天文学→郭守敬の<b>授時暦</b>。中国絵画→イランの細密画(ミニアチュール)。コバルト顔料→染付。">
<rect x="505" y="500" width="140" height="36" rx="6" fill="rgba(130,100,160,.15)" stroke="rgba(130,100,160,.3)" stroke-width="1.5"/>
<text x="575.0" y="522.0" text-anchor="middle" fill="#c0a0d4" font-size="9" font-family="Noto Serif JP" font-weight="700">東西文化の交流</text>
</g>
<g class="nd" data-id="silver" data-desc="<strong>銀と紙幣</strong><br>銀がユーラシア共通の決済手段に。元は銀との交換を前提に紙幣<b>交鈔</b>を発行して主要な通貨とした。<br>★徴税の請負や塩の専売で集めた銀が、ムスリム商人への投資を通じて西方へ流れた。">
<rect x="715" y="500" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="785.0" y="522.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">銀を基準とする経済と交鈔</text>
</g>
<g class="nd" data-id="plague" data-desc="<strong>疫病の伝播</strong><br>活発化した交通路に沿ってペストが広がり、1347年以降、西アジア・北アフリカ・ヨーロッパで大流行した。<br>★ヨーロッパでは人口の約3分の1が失われたとされる(→「14世紀の危機」)。">
<rect x="265" y="620" width="169" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="350.0" y="642.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">ペスト(黒死病)の大流行(14C半ば)</text>
</g>
<g class="nd" data-id="infl" data-desc="<strong>元の財政の破綻</strong><br>チベット仏教への莫大な寄進や宮廷の浪費、帝位をめぐる内紛が続く→<b>交鈔の濫発で物価が高騰</b>。専売の強化も民衆を圧迫した。">
<rect x="715" y="620" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="785.0" y="642.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">交鈔の濫発・財政の破綻</text>
</g>
<g class="nd" data-id="hong" data-desc="<strong>★紅巾の乱→明の成立</strong><br>黄河の治水工事への徴発をきっかけに、白蓮教徒などが蜂起した<b>紅巾の乱</b>。その中から貧農出身の<b>朱元璋</b>が台頭し、1368年に南京で明を建てた。<br>★元はモンゴル高原へ退いた(北元)。">
<rect x="524" y="735" width="191" height="46" rx="6" fill="rgba(180,80,80,.2)" stroke="rgba(180,80,80,.4)" stroke-width="1.5"/>
<text x="620.0" y="762.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">★紅巾の乱(1351-66)→明の成立(1368)</text>
</g>

</svg>

<g class="nd" data-id="clim" data-desc="<strong>気候の寒冷化(14C初-)</strong><br>11-13世紀の温暖期と大開墾時代が終わり、気候が寒冷化して凶作と飢饉が頻発(1315-17年の大飢饉など)。<br>★耕地の拡大は限界に達し、増えすぎた人口を養えなくなっていた。">

<text x="130.0" y="42.0" text-anchor="middle" fill="#c0c0a0" font-size="9" font-family="Noto Serif JP" font-weight="700">気候の寒冷化・凶作・飢饉</text>
</g>
<g class="nd" data-id="plag" data-desc="<strong>★黒死病の大流行(1347-)</strong><br>モンゴル帝国のもとで活発化した交易路を通って、黒海沿岸からイタリア商人の船で地中海へ。数年で全ヨーロッパに拡大した。<br>★社会不安の中でユダヤ人の迫害も起こった。">
<rect x="335" y="15" width="170" height="46" rx="6" fill="rgba(180,80,80,.2)" stroke="rgba(180,80,80,.4)" stroke-width="1.5"/>
<text x="420.0" y="42.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">★黒死病(ペスト)の大流行(1347-)</text>
</g>
<g class="nd" data-id="money" data-desc="<strong>貨幣経済の浸透(12-13C-)</strong><br>十字軍以降の遠隔地商業と都市の発展により、農村にも貨幣経済が広がった。<br>★領主も貨幣収入を必要とするようになり、農民は余剰の生産物を市場で売って貨幣を蓄えはじめた。">
<rect x="650" y="20" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="720.0" y="42.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">貨幣経済の浸透</text>
</g>
<g class="nd" data-id="pop" data-desc="<strong>人口の激減</strong><br>飢饉と黒死病で、ヨーロッパの人口の約3分の1が失われたとされる。<br>★耕作者を失って放棄される村(廃村)も各地に現れた。">
<rect x="200" y="140" width="140" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="270.0" y="162.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">人口の激減(約3分の1)</text>
</g>
<g class="nd" data-id="rent" data-desc="<strong>地代の変化</strong><br>領主は直営地での<b>賦役(労働地代)をやめて直営地を農民に貸し出し</b>、生産物や貨幣で地代を取る(純粋荘園)。<br>★農民は領主への人格的な従属から離れ、経済的に力をつける。とくにイギリスで進んだ。">
<rect x="620" y="140" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="690.0" y="162.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">地代の金納化・賦役の廃止</text>
</g>
<g class="nd" data-id="labor" data-desc="<strong>農民の地位の向上</strong><br>働き手が希少になって賃金が上昇。領主は農民を引き留めるために待遇を改善せざるをえず、農民は有利な条件を求めて移動した。">
<rect x="58" y="260" width="143" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="130.0" y="282.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">労働力不足→農民の地位向上</text>
</g>
<g class="nd" data-id="lord" data-desc="<strong>領主の経済的な困窮</strong><br>農民の減少で地代収入が減る一方、賃金と物価は上昇。貨幣で固定された地代は、貨幣価値の下落で実質的に目減りした。">
<rect x="370" y="260" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="440.0" y="282.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">領主層の困窮</text>
</g>
<g class="nd" data-id="war" data-desc="<strong>百年戦争と戦術の変化</strong><br>クレシーの戦い(1346)でイギリスの<b>長弓兵</b>がフランスの重装騎士軍を破る。やがて<b>火砲</b>も普及し、傭兵や常備軍が軍の主力となった。<br>★長期の戦争は、重税と国土の荒廃ももたらした。">
<rect x="664" y="260" width="171" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="750.0" y="282.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">百年戦争(1339-1453)と戦術の変化</text>
</g>
<g class="nd" data-id="react" data-desc="<strong>封建反動</strong><br>困窮した領主が、<b>賦役の復活や地代の引き上げ、賃金の統制</b>によって農民への支配を再び強めようとした動き。<br>★イギリスの労働者規制法(1351)＝賃金を黒死病以前の水準に固定しようとした。">
<rect x="260" y="380" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="330.0" y="402.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">封建反動</text>
</g>
<g class="nd" data-id="revolt" data-desc="<strong>★大規模な農民一揆</strong><br>フランス＝<b>ジャックリーの乱(1358)</b>。イギリス＝<b>ワット＝タイラーの乱(1381)</b>：人頭税への反発、聖職者ジョン＝ボール「アダムが耕しイヴが紡いだとき、だれが貴族であったか」。<br>★いずれも鎮圧されたが、領主は農奴制を維持できなくなった。">
<rect x="112" y="495" width="216" height="46" rx="6" fill="rgba(180,80,80,.2)" stroke="rgba(180,80,80,.4)" stroke-width="1.5"/>
<text x="220.0" y="522.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">★農民一揆(ジャックリー・ワット＝タイラー)</text>
</g>
<g class="nd" data-id="knight" data-desc="<strong>諸侯・騎士の没落</strong><br>所領経営の悪化と、戦場での役割の低下により、中小領主である騎士が没落した。<br>★国王の宮廷に仕える<b>廷臣</b>となるか、地方の地主(イギリスのジェントリ)として生き残る道を選ぶ。">
<rect x="550" y="500" width="140" height="36" rx="6" fill="rgba(130,130,100,.15)" stroke="rgba(130,130,100,.3)" stroke-width="1.5"/>
<text x="620.0" y="522.0" text-anchor="middle" fill="#c0c0a0" font-size="9" font-family="Noto Serif JP" font-weight="700">諸侯・騎士の没落</text>
</g>
<g class="nd" data-id="yeoman" data-desc="<strong>農奴解放</strong><br>農民は貨幣で解放金を支払って農奴身分から解放された。イギリスでは<b>独立自営農民(ヨーマン)</b>が成長。<br>★荘園制と農奴制＝封建社会の経済的な基盤が解体する。(エルベ川以東では逆に農奴制が強化されていく)">
<rect x="134" y="620" width="171" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="220.0" y="642.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">農奴解放→独立自営農民(ヨーマン)</text>
</g>
<g class="nd" data-id="king" data-desc="<strong>★王権の伸張</strong><br>国王は大商人と結んで財源を確保し、官僚制と常備軍を整えた。フランス＝シャルル7世が財政を再建して常備軍を創設。イギリス＝バラ戦争(1455-85)で諸侯が共倒れ→<b>テューダー朝</b>。<br>★封建的な主従関係にもとづく分権的な国家から、国王を中心とする中央集権国家へ。">
<rect x="564" y="615" width="152" height="46" rx="6" fill="rgba(180,140,60,.2)" stroke="rgba(180,140,60,.4)" stroke-width="1.5"/>
<text x="640.0" y="642.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">★王権の伸張→中央集権国家へ</text>
</g>

<g class="nd" data-id="reli" data-desc="<strong>宗派対立</strong><br>アウクスブルクの和議(1555)は「領主の宗教がその領民の宗教」とし、個人の信仰の自由とカルヴァン派は認めなかった。<br>★宗派の対立が、各国の政治的な対立と結びついていく。">

<text x="140.0" y="42.0" text-anchor="middle" fill="#c0a0d4" font-size="9" font-family="Noto Serif JP" font-weight="700">宗教改革後の宗派対立</text>
</g>
<g class="nd" data-id="clim" data-desc="<strong>気候の寒冷化</strong><br>17世紀は「小氷期」のなかでもとくに寒冷な時期で、凶作・飢饉・疫病が頻発した。<br>★16世紀に増加を続けたヨーロッパの人口は停滞に転じた。">
<rect x="368" y="20" width="144" height="36" rx="6" fill="rgba(130,130,100,.15)" stroke="rgba(130,130,100,.3)" stroke-width="1.5"/>
<text x="440.0" y="42.0" text-anchor="middle" fill="#c0c0a0" font-size="9" font-family="Noto Serif JP" font-weight="700">小氷期(寒冷化)・凶作・疫病</text>
</g>
<g class="nd" data-id="silver" data-desc="<strong>銀の流入の減少</strong><br>16世紀の好況を支えたアメリカ大陸の銀の流入が、17世紀に入って減少。価格革命による物価の上昇が止まり、経済は停滞に向かった。<br>★銀に依存した交易は世界規模でつながっていたため、影響は東アジアにも及んだ。">
<rect x="670" y="20" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="740.0" y="42.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">アメリカ銀の流入減少</text>
</g>
<g class="nd" data-id="crisis" data-desc="<strong>★「17世紀の危機」</strong><br>16世紀の経済成長が止まり、人口の停滞、物価の下落、凶作、疫病、戦乱、反乱が同時に各地を襲った。<br>★限られた富をめぐって、国家の間でも、国内の身分や集団の間でも争いが激化。各国が異なる形で危機に対応し、その後の進路が分かれた。">
<rect x="336" y="135" width="207" height="46" rx="6" fill="rgba(180,80,80,.2)" stroke="rgba(180,80,80,.4)" stroke-width="1.5"/>
<text x="440.0" y="162.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">★「17世紀の危機」＝経済の停滞と社会不安</text>
</g>
<g class="nd" data-id="thirty" data-desc="<strong>三十年戦争(1618-48)</strong><br>ベーメン(ボヘミア)の新教徒の反乱から始まり、デンマーク・スウェーデン・フランスが介入。宗教戦争から、ハプスブルク家とフランスの覇権争いへ変質した。<br>★傭兵軍の略奪でドイツの人口は大きく減少。">
<rect x="60" y="260" width="140" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="130.0" y="282.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">三十年戦争(1618-48)</text>
</g>
<g class="nd" data-id="engl" data-desc="<strong>イギリス革命</strong><br>ステュアート朝の専制と国教の強制、議会の同意のない課税に、ジェントリやピューリタンが多い議会が反発→<b>ピューリタン革命</b>(チャールズ1世を処刑 1649)→クロムウェルの共和政→王政復古→<b>名誉革命</b>。">
<rect x="280" y="260" width="169" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="365.0" y="282.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">イギリス革命(1640-60・1688-89)</text>
</g>
<g class="nd" data-id="fronde" data-desc="<strong>フロンドの乱(1648-53)</strong><br>三十年戦争の戦費のための増税と王権の強化に、高等法院や貴族が反乱。幼いルイ14世は一時パリを追われた。<br>★宰相マザランが鎮圧。フランスで最後の大規模な貴族の反乱となった。">
<rect x="520" y="260" width="140" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="590.0" y="282.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">フロンドの乱(1648-53)</text>
</g>
<g class="nd" data-id="ming" data-desc="<strong>明清交替(1644)</strong><br>寒冷化による飢饉、北方の防衛のための増税に、銀の流入の減少が重なる。<b>李自成</b>の反乱軍が北京を占領して明が滅び、明の武将の呉三桂に導かれた清が入関した。<br>★東アジアも同じ時期に動乱を経験した。">
<rect x="715" y="260" width="140" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="785.0" y="282.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">明清交替(1644)</text>
</g>
<g class="nd" data-id="westf" data-desc="<strong>ウェストファリア条約(1648)</strong><br>ドイツの領邦にほぼ完全な主権を認める→神聖ローマ帝国は有名無実に。スイスとオランダの独立を正式に承認。フランスがアルザスを獲得。<br>★対等な<b>主権国家</b>が並び立つ国際秩序が確立した。">
<rect x="60" y="380" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="130.0" y="402.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">主権国家体制の確立(1648)</text>
</g>
<g class="nd" data-id="parl" data-desc="<strong>イギリスの立憲王政</strong><br><b>権利の章典(1689)</b>＝議会の同意のない課税や法の停止を否定し、議会主権にもとづく立憲王政が確立。のちハノーヴァー朝(1714-)のもとでウォルポールの責任内閣制が成立し、「王は君臨すれども統治せず」の原則が定着した。<br>★議会が保証する国債と<b>イングランド銀行(1694)</b>により、戦費を低利で大量に調達できる体制が整った(財政革命)。">
<rect x="295" y="380" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="365.0" y="402.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">議会主権・立憲王政(1689)</text>
</g>
<g class="nd" data-id="absol" data-desc="<strong>★ルイ14世の親政(1661-1715)</strong><br>反乱を抑え込んだ王権が貴族を宮廷に取り込む(ヴェルサイユ宮殿)。「朕は国家なり」、王権神授説、官僚制と常備軍。<br>★ナントの王令の廃止(1685)→ユグノーの商工業者が国外に流出した。">
<rect x="517" y="375" width="145" height="46" rx="6" fill="rgba(180,140,60,.2)" stroke="rgba(180,140,60,.4)" stroke-width="1.5"/>
<text x="590.0" y="402.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">★絶対王政の完成(ルイ14世)</text>
</g>
<g class="nd" data-id="qing" data-desc="<strong>清の支配の安定</strong><br>康熙帝が三藩の乱を鎮圧し、台湾の鄭氏を降伏させる(1683)→海禁を解除し、交易が回復。<br>★18世紀には人口が急増し、「盛世」と呼ばれる繁栄へ。">
<rect x="715" y="380" width="140" height="36" rx="6" fill="rgba(180,140,60,.15)" stroke="rgba(180,140,60,.3)" stroke-width="1.5"/>
<text x="785.0" y="402.0" text-anchor="middle" fill="#d4c088" font-size="9" font-family="Noto Serif JP" font-weight="700">清の中国支配と海禁の解除</text>
</g>
<g class="nd" data-id="dutch" data-desc="<strong>商業覇権の移動</strong><br>危機の時代に例外的に繁栄したのが<b>オランダ</b>：中継貿易・東インド会社・アムステルダムの金融。これに対抗してイギリスが<b>航海法(1651)</b>→3回の英蘭戦争(1652-74)。<br>★商業覇権はオランダからイギリスへ。">
<rect x="224" y="500" width="152" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="300.0" y="522.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">オランダの繁栄→英の商業覇権</text>
</g>
<g class="nd" data-id="merc" data-desc="<strong>重商主義</strong><br>世界の富の総量は一定と考え、国家が貿易と産業を統制して富を奪い合う。フランス＝財務総監<b>コルベール</b>が王立マニュファクチュアの設立と東インド会社の再建を進めた。<br>★北アメリカ・インド・カリブ海で植民地を争奪。">
<rect x="550" y="500" width="140" height="36" rx="6" fill="rgba(80,150,120,.15)" stroke="rgba(80,150,120,.3)" stroke-width="1.5"/>
<text x="620.0" y="522.0" text-anchor="middle" fill="#88d4b0" font-size="9" font-family="Noto Serif JP" font-weight="700">重商主義と植民地の争奪</text>
</g>
<g class="nd" data-id="second" data-desc="<strong>第2次英仏百年戦争(1689-1815)</strong><br>ヨーロッパでの戦争のたびに、植民地でも英仏が戦った：ウィリアム王戦争、アン女王戦争、ジョージ王戦争、フレンチ＝インディアン戦争。<br>★戦費の調達力にまさるイギリスが、<b>パリ条約(1763)</b>で北アメリカとインドでの優位を確立した。">
<rect x="381" y="620" width="158" height="36" rx="6" fill="rgba(180,80,80,.15)" stroke="rgba(180,80,80,.3)" stroke-width="1.5"/>
<text x="460.0" y="642.0" text-anchor="middle" fill="#d48888" font-size="9" font-family="Noto Serif JP" font-weight="700">第2次英仏百年戦争(1689-1815)</text>
</g>

<g class="nd" data-id="enl" data-desc="<strong>啓蒙思想</strong><br>ロック＝抵抗権(革命権)、モンテスキュー＝三権分立、ルソー＝人民主権。<br>★アメリカ独立宣言と、フランス人権宣言の理論的な支柱となった。">

<g class="nd" data-id="seven" data-desc="<strong>★七年戦争(1756-63)</strong><br>ヨーロッパ・北アメリカ(フレンチ＝インディアン戦争)・インド(プラッシーの戦い)で英仏が戦った世界規模の戦争。<br>★<b>パリ条約(1763)</b>でイギリスが勝利したが、勝者も敗者も巨額の負債を抱えた。">

<g class="nd" data-id="atl" data-desc="<strong>大西洋経済の発展</strong><br>砂糖やタバコ、奴隷貿易を軸に大西洋の両岸が結びつき、植民地の社会が経済的に成熟。13植民地は植民地議会による自治の伝統を持ち、ラテンアメリカでは植民地生まれの白人<b>クリオーリョ</b>が地主として成長した。<br>★本国の重商主義的な統制が、しだいに足かせとなる。">

<div class="tooltip-box" id="tooltip"></div>
<script>
function showTheme(key) {
  document.querySelectorAll('.theme-svg').forEach(function(el){el.style.display='none';});
  document.getElementById('theme-'+key).style.display='';
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-key')===key);
  });
  clearHighlight();
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){ showTheme(this.getAttribute('data-key')); });
});
var tooltip = document.getElementById('tooltip');
document.addEventListener('click', function(e) {
  var nd = e.target.closest('.nd');
  if (nd) {
    var id = nd.getAttribute('data-id');
    var desc = nd.getAttribute('data-desc');
    var container = nd.closest('.theme-svg');
    container.querySelector('svg').classList.add('dim');
    container.querySelectorAll('.nd').forEach(function(n){n.classList.remove('hi');});
    container.querySelectorAll('.ed').forEach(function(ed){ed.classList.remove('hi');});
    nd.classList.add('hi');
    container.querySelectorAll('.ed').forEach(function(ed){
      if(ed.getAttribute('data-from')===id || ed.getAttribute('data-to')===id){
        ed.classList.add('hi');
        var other = ed.getAttribute('data-from')===id ? ed.getAttribute('data-to') : ed.getAttribute('data-from');
        var otherNd = container.querySelector('.nd[data-id="'+other+'"]');
        if(otherNd) otherNd.classList.add('hi');
      }
    });
    tooltip.innerHTML = desc;
    tooltip.style.display = 'block';
    var rect = nd.getBoundingClientRect();
    var tx = rect.right + 10;
    var ty = rect.top;
    if (tx + 350 > window.innerWidth) tx = rect.left - 350;
    if (ty + 300 > window.innerHeight) ty = window.innerHeight - 320;
    if (ty < 10) ty = 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  } else if (!e.target.closest('.tooltip-box') && !e.target.closest('.tabs')) {
    clearHighlight();
  }
});
function clearHighlight() {
  document.querySelectorAll('svg').forEach(function(s){s.classList.remove('dim');});
  document.querySelectorAll('.nd').forEach(function(n){n.classList.remove('hi');});
  document.querySelectorAll('.ed').forEach(function(ed){ed.classList.remove('hi');});
  tooltip.style.display = 'none';
}</script>
