の外港。北京条約(1860)で開港され、各国の租界が置かれた。義和団事件では8カ国連合軍の上陸・進撃路となった。"], "河北省": [null, "<strong>直隷(現在の河北省)</strong><br>山東省で起こった義和団が1900年にこの地方へ広がり、鉄道や教会を破壊しながら北京・天津に入った。"], "チベット自治区": [null, "<strong>チベット</strong><br>インドを支配するイギリスと、中央アジアを南下するロシアが影響力を争った(グレートゲーム)。イギリスは1904年にラサへ軍を送り、通商上の特権を得た。英露協商(1907)で両国はチベットへの不干渉を取り決めた。"], "新疆ウイグル自治区": [null, "<strong>新疆</strong><br>1860-70年代のムスリム反乱とヤークーブ＝ベクの政権に乗じて、ロシアがイリ地方を占領(1871)。<strong>イリ条約(1881)</strong>でイリ地方の大半は清に返還されたが、ロシアは通商上の特権を得た。清は1884年に新疆省を置いて直轄化した。"]};
var LEASES=[["膠州湾(青島)", 36.07, 120.3, "de", "1898年 ドイツが租借(99年)", "宣教師殺害事件(1897)を口実に占領。青島を建設。租借地獲得競争の口火。第一次世界大戦で日本が占領(1914)→ワシントン会議(1921-22)を経て中国に返還。"], ["旅順・大連", 38.9, 121.45, "ru", "1898年 ロシアが租借(25年) → 1905年 日本へ", "三国干渉で日本に返還させた遼東半島の南端を、ロシア自身が租借。旅順に太平洋艦隊の軍港、大連に商港を建設した。日露戦争の激戦地。ポーツマス条約(1905)で租借権は日本に移り、日本は関東州として統治した。"], ["威海衛", 37.5, 122.12, "uk", "1898年 イギリスが租借(25年)", "渤海湾の入口をはさんで旅順の対岸にあたる。もとは清の北洋艦隊の基地で、日清戦争で日本軍が占領していた。ロシアの旅順租借に対抗してイギリスが租借。1930年に返還。"], ["九竜半島(新界)", 22.45, 114.15, "uk", "1898年 イギリスが租借(99年)", "香港島・九竜半島南部(割譲地)の防衛のために、背後の新界を租借。租借期限の1997年に香港全域が中国へ返還された。"], ["広州湾", 21.2, 110.4, "fr", "1899年 フランスが租借(99年)", "広東省西部の雷州半島にある湾。フランス領インドシナ連邦に編入して統治した。1945年に返還。"]];
var RAILS=[["東清鉄道(ロシア)", "ru", [[49.6, 117.43], [49.21, 119.74], [47.35, 123.92], [45.75, 126.65], [44.55, 129.63], [44.41, 131.15]], "<strong>東清鉄道</strong><br>露清密約(1896)でロシアが敷設権を獲得。満洲を横断してシベリア鉄道とウラジヴォストークを最短で結ぶ(1903年全通)。沿線には鉄道の守備を名目にロシア軍が駐屯した。"], ["東清鉄道 南満洲支線", "ru", [[45.75, 126.65], [43.88, 125.32], [41.8, 123.43], [38.91, 121.6], [38.81, 121.26]], "<strong>東清鉄道の南満洲支線(ハルビン-旅順)</strong><br>旅順・大連の租借(1898)とともに敷設権を獲得。ポーツマス条約(1905)で<strong>長春以南が日本に譲渡</strong>され、南満洲鉄道株式会社(満鉄 1906設立)が経営→日本の満洲進出の足がかりに。"], ["膠済鉄道(ドイツ)", "de", [[36.07, 120.38], [36.71, 119.1], [36.65, 117.0]], "<strong>膠済鉄道(青島-済南)</strong><br>膠州湾の租借とともにドイツが敷設権を獲得(1904年開通)。沿線の鉱山の採掘権もあわせて得た。"], ["滇越鉄道(フランス)", "fr", [[25.04, 102.71], [23.36, 103.4], [22.51, 103.96], [21.03, 105.85]], "<strong>滇越鉄道(昆明-ハノイ)</strong><br>フランスが敷設権を得て建設(1910年全通)。フランス領インドシナと雲南省を直結した。「滇」は雲南の別称。"]];
var EVENTS=[["下関条約(1895)", 33.95, 130.95, "<strong>下関条約(1895)</strong><br>日清戦争の講和条約。①朝鮮の独立の承認 ②遼東半島・台湾・澎湖諸島の割譲 ③賠償金2億両 ④重慶・杭州など4港の開港と、開港場での工場設置の承認。<br>★「眠れる獅子」と恐れられた清の弱体ぶりが明らかになり、列強の中国進出が一気に激化。清は賠償金を支払うために列強から借款を受け(担保は関税収入など)、列強はその見返りとして鉄道敷設権・鉱山採掘権を獲得し、さらに各地に租借地を設定していった。"], ["義和団の発生(山東省 1899-)", 36.9, 116.2, "<strong>義和団</strong><br>山東省の農村で生まれた、武術と呪術を修練する宗教的な結社。ドイツの進出とキリスト教の布教への反発(仇教運動)を背景に急速に拡大。「<strong>扶清滅洋</strong>」(清を扶け、西洋を滅ぼす)を掲げて鉄道・電信・教会を破壊し、1900年に北京へ入った。"]];
var map=L.map('map',{zoomControl:true,attributionControl:false}).setView([33,112],4);
L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:10,minZoom:3}).addTo(map);
function badge(p){return p?'<span class="pw" style="background:'+POW[p][1]+'">'+POW[p][0]+'</span>':'';}
var geoLayer=L.geoJSON(TERR,{
  style:function(f){var inf=INFO[f.properties.N];var p=inf&&inf[0];
    return p?{color:POW[p][1],weight:1.2,fillColor:POW[p][1],fillOpacity:0.42,opacity:0.9}:{color:'#999',weight:0.8,fillColor:'#888',fillOpacity:0.06,opacity:0.45};},
  onEachFeature:function(f,layer){var inf=INFO[f.properties.N];
    layer.bindPopup(inf?(badge(inf[0])+'<span class="cap">'+f.properties.N+'(現在の行政区画)</span><br>'+inf[1]):('<strong>'+f.properties.N+'</strong><br><span class="cap">特定の国の勢力範囲とはされなかった地域</span>'),{maxWidth:300});}
}).addTo(map);
geoLayer.eachLayer(function(layer){var name=layer.feature.properties.N;var inf=INFO[name];if(!inf||!inf[0])return;
  var c=layer.getBounds().getCenter();var short=name.replace(/(省|市|自治区|チワン族自治区|ウイグル自治区)$/,'').replace('広西チワン族','広西');
  L.marker(c,{icon:L.divIcon({className:'cl',html:'<div style="font-size:9px;color:rgba(255,255,255,.85);font-weight:600;text-shadow:0 0 4px #000;white-space:nowrap;transform:translate(-50%,-50%)">'+short+'</div>',iconSize:null}),interactive:false}).addTo(map);});
var gLease=L.layerGroup().addTo(map),gRail=L.layerGroup().addTo(map),gEvent=L.layerGroup().addTo(map);
RAILS.forEach(function(r){L.polyline(r[2],{color:POW[r[1]][1],weight:3,opacity:.95,dashArray:'7 5'}).bindPopup(badge(r[1])+r[3],{maxWidth:300}).bindTooltip(r[0],{sticky:true}).addTo(gRail);});
LEASES.forEach(function(l){var col=POW[l[3]][1];
  L.marker([l[1],l[2]],{icon:L.divIcon({className:'cl',html:'<div style="transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center"><div style="width:13px;height:13px;border-radius:50%;background:'+col+';border:2px solid #fff;box-shadow:0 0 5px #000"></div><div style="font-size:9.5px;font-weight:700;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap;margin-top:1px">'+l[0]+'</div></div>',iconSize:null})})
  .bindPopup(badge(l[3])+'<strong>'+l[0]+'</strong><br><span class="cap">'+l[4]+'</span><br>'+l[5],{maxWidth:300}).addTo(gLease);});
L.circle([23.35,115.6],{radius:150000,color:POW.uk[1],weight:2,dashArray:'5 5',fillColor:POW.uk[1],fillOpacity:.28}).bindPopup(badge('uk')+'<strong>広東東部</strong><br>香港の後背地にあたる広東省の東部は、長江流域とともにイギリスの勢力範囲とされた。(円はおおよその位置を示す)',{maxWidth:300}).addTo(map);
EVENTS.forEach(function(e){L.marker([e[1],e[2]],{icon:L.divIcon({className:'cl',html:'<div style="transform:translate(-50%,-50%);font-size:9px;font-weight:700;color:#ffe9a8;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap">◆ '+e[0]+'</div>',iconSize:null})}).bindPopup(e[3],{maxWidth:300}).addTo(gEvent);});
[['tLease',gLease],['tRail',gRail],['tEvent',gEvent]].forEach(function(p){document.getElementById(p[0]).addEventListener('change',function(){if(this.checked)map.addLayer(p[1]);else map.removeLayer(p[1]);});});
var lg=L.control({position:'bottomright'});lg.onAdd=function(){var d=L.DomUtil.create('div','lg');var h='<b>勢力範囲(1898-1900頃)</b><br>';
  ['ru','de','uk','fr','jp','pt'].forEach(function(k){h+='<i style="background:'+POW[k][1]+'"></i>'+POW[k][0]+(k==='jp'?'(台湾は領有)':k==='pt'?'(マカオ)':'')+'<br>';});
  h+='● 租借地　┅ 鉄道<br><span style="color:#777;font-size:9px">※省の境界は現在のもの。範囲は概略。広東は西部＝仏、東部＝英</span>';d.innerHTML=h;return d;};lg.addTo(map);
var pt=L.control({position:'topright'});pt.onAdd=function(){var d=L.DomUtil.create('div');d.innerHTML="<details class=\"pt\" open><summary>▼ 中国分割の要点(クリックで開閉)</summary><div class=\"in\"><p><strong>❶ きっかけ＝日清戦争の敗北(1895)</strong>：清の弱体が明らかになり、賠償金支払いのための借款と引きかえに、列強が鉄道敷設権・鉱山採掘権を獲得。</p><p><strong>❷ 1898年に集中した租借</strong>：ドイツの膠州湾 → ロシアの旅順・大連 → イギリスの威海衛・九竜半島(新界) → フランスの広州湾(1899)。租借地＝期限つきで借り受け、統治権まで行使する土地。</p><p><strong>❸ 勢力範囲</strong>：「その地域を他国に割譲・租借させない」と清に約束させ、鉄道や鉱山の利権を優先的に独占する範囲。植民地のように領有したわけではない。</p><p><strong>❹ アメリカの門戸開放宣言</strong>：米西戦争(1898)とフィリピン領有で出遅れたアメリカは、国務長官<strong>ジョン＝ヘイ</strong>が1899年に<strong>門戸開放・機会均等</strong>、1900年に<strong>領土保全</strong>を列強に提唱し、中国市場への割り込みをはかった。</p><p><strong>❺ 中国側の反応</strong>：上からの改革＝戊戌の変法(1898)は挫折。民衆の排外運動＝義和団事件(1900)は8カ国連合軍に鎮圧され、北京議定書(1901)で清の半植民地化が決定的に → 光緒新政、そして辛亥革命(1911)へ。</p><p><strong>❻ 列強間の対立へ</strong>：満洲を占領したロシアに対し、日英同盟(1902) → 日露戦争(1904-05) → ポーツマス条約で南満洲の利権は日本へ。</p></div></details>";L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
  if(window.innerWidth<700)d.querySelector('details').removeAttribute('open');return d;};pt.addTo(map);
</script></body></html>
